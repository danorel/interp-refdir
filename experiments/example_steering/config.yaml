# Contrastive direction -> steering, with a norm-matched random-direction control.
# Template for "find a direction, intervene, measure behaviour" projects (e.g. refusal).
#   uv run interp-run experiments/example_steering/config.yaml
#   uv run interp-run experiments/example_steering/config.yaml model=configs/models/qwen3-0.6b.yaml judge=null
name: example_steering
target: experiments.example_steering.experiment:SteeringExperiment
seed: 0
model: configs/models/qwen3-8b.yaml
generation:
  max_new_tokens: 64
  batch_size: 8
judge:
  backend: llm
  model: google/gemini-3.8-flash
  reasoning_effort: low
params:
  tasks:
    positive: {type: jsonl, path: experiments/example_steering/data/positive.jsonl}
    negative: {type: jsonl, path: experiments/example_steering/data/negative.jsonl}
    eval: {type: jsonl, path: experiments/example_steering/data/eval.jsonl}
  layer_frac: 0.5          # layer = round(layer_frac * num_layers)
  positions: [-1]          # last prompt token (end of chat template)
  scales: [0.0, 1.0, 2.0, 4.0]  # multiples of the raw mean-diff vector
  n_random_controls: 3
