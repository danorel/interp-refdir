[project]
name = "interptemp"
version = "0.1.0"
description = "Template for fast mech-interp experiments: generation, activations, interventions, LLM judges."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nnterp>=1.3.0",
    "torch>=2.6",
    "transformers>=4.51",
    "datasets>=3.0",
    "openai>=1.60",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.11.2",
]

[project.scripts]
interp-run = "interptemp.run:main"
interp-label = "interptemp.label:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interptemp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
ignore = [
    "E501",   # formatter owns line length
    "RUF001", # unicode in strings (Ukrainian notes are fine)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"experiments/**" = ["E402"] # `# %%` cell scripts import mid-file
"tests/**" = ["PT011", "PT018"]

[tool.pyright]
include = ["src", "experiments", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# nnsight proxies are dynamically typed; don't fight them.
reportAttributeAccessIssue = "none"
reportCallIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # `experiments.*` importable, as interp-run does
markers = [
    "model: loads a real (small) model; slower, needs HF download",
    "api: calls OpenRouter; needs OPENROUTER_API_KEY",
]
addopts = "-m 'not model and not api'"
